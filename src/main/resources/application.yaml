spring:
  application:
    name: spring_auth_jwt
  datasource:
    url: jdbc:mysql://localhost:3306/spring_jwt_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: punna
    password: punna
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # creates/updates tables automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  jackson:
    serialization:
      indent_output: true

server:
  port: 8080

jwt:
  secret: MySuperSecretKey12345
  expiration: 3600000  # 1 hour in milliseconds
